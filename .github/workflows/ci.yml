name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest tested Python.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major-version tag; Dependabot bumps this pin.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
